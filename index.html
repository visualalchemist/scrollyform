<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OFF GRID · ऑफ़ ग्रिड — The Pause is the Product</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wght@400;600;700;800&family=Anek+Latin:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --c:#E63323;         /* OFF GRID Scarlet */
  --bg:#F3EEE2;        /* OFF GRID Paper cream */
  --fg:#0E1116;        /* OFF GRID Ink */
  --dim:#686458;
  --paper-cool:#E7E3D6;
  --cobalt:#1D3BE0;
  --sun:#F6D32B;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1116;
    --fg:#F3EEE2;
    --dim:#8d8a7e;
    --c:#E63323
  }
}
:root[data-theme="dark"]{--bg:#0E1116;--fg:#F3EEE2;--dim:#8d8a7e;--c:#E63323}
:root[data-theme="golden-hour"]{--bg:#1D3BE0;--fg:#F3EEE2;--dim:#b6bfe0;--c:#F6D32B}
:root[data-theme="paper"]{--bg:#F3EEE2;--fg:#0E1116;--dim:#686458;--c:#E63323}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font:16px/1.55 'Anek Latin','Anek Devanagari',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  transition:background .4s, color .4s;
  -webkit-font-smoothing:antialiased
}
#a{
  position:fixed;
  left:0;
  top:0;
  width:52vw;
  height:100%;
  margin:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--c);
  white-space:pre;
  line-height:1.2;
  pointer-events:none;
  z-index:0;
  transition:color .6s;
  overflow:hidden;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace
}
#bar{
  position:fixed;
  top:env(safe-area-inset-top,0px);
  left:0;
  right:0;
  padding:14px 22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12px;
  letter-spacing:.08em;
  color:var(--dim);
  z-index:5;
  text-transform:uppercase
}
#bar b{color:var(--c);font-weight:500;white-space:pre}
#bar .thm{
  background:none;
  border:1px solid var(--dim);
  color:var(--fg);
  font:inherit;
  font-size:10px;
  padding:2px 8px;
  cursor:pointer;
  letter-spacing:.08em;
  text-transform:uppercase;
  margin-left:12px;
  border-radius:4px;
  transition:all .2s
}
#bar .thm:hover{background:var(--c);color:var(--bg);border-color:var(--c)}
main{position:relative;z-index:2;margin-left:50vw;width:46vw}
section{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:90px 0;
  opacity:.18;
  transform:translateY(24px);
  transition:opacity .6s,transform .6s
}
section.on{opacity:1;transform:none}
.n{color:var(--c);font-size:13px;letter-spacing:.14em;margin-bottom:14px}
h1,h2{font-weight:700;margin:0 0 28px;letter-spacing:-.03em;line-height:1.05}
h1{font-size:clamp(40px,6vw,84px)}
h1 .hi{display:block;font-family:'Anek Devanagari';font-size:clamp(34px,5.2vw,72px);color:var(--c);margin-top:2px}
h2{font-size:clamp(28px,3.6vw,50px)}
p.s{color:var(--dim);margin:0 0 24px;max-width:38ch;font-size:15px;line-height:1.6}
input[type=text],input[type=email],textarea{
  width:100%;
  background:none;
  border:0;
  border-bottom:2px solid var(--dim);
  color:var(--fg);
  font:inherit;
  font-size:clamp(18px,2vw,26px);
  padding:10px 0;
  outline:0;
  border-radius:0;
  transition:border-color .3s;
  resize:none
}
input:focus,textarea:focus{border-color:var(--c)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{
  background:none;
  border:1.5px solid var(--dim);
  color:var(--fg);
  font:inherit;
  padding:10px 18px;
  cursor:pointer;
  border-radius:999px;
  transition:all .2s;
  display:flex;
  align-items:center;
  gap:10px
}
.chip:hover{border-color:var(--c)}
.chip.sel{background:var(--c);border-color:var(--c);color:var(--bg);font-weight:600}
input[type=range]{width:100%;accent-color:var(--c);cursor:pointer}
.rl{color:var(--c);font-size:20px;margin-top:8px}
.nx{
  align-self:flex-start;
  margin-top:30px;
  background:none;
  border:0;
  color:var(--fg);
  font:inherit;
  cursor:pointer;
  padding:6px 0;
  border-bottom:1.5px solid var(--c);
  letter-spacing:.04em;
  text-transform:uppercase
}
.nx:hover{color:var(--c)}
.h{color:var(--c);font-size:13px;min-height:20px;margin-top:10px}
#out{
  white-space:pre-wrap;
  word-break:break-word;
  font-size:12px;
  color:var(--dim);
  border:1px dashed var(--dim);
  padding:14px;
  margin-top:20px;
  max-height:40vh;
  overflow:auto
}
.sh{animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (max-width:800px){
  #a{width:100%;opacity:.22}
  main{margin:0;width:auto;padding:0 24px}
}
@media (prefers-reduced-motion:reduce){section{transition:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<pre id="a" aria-hidden="true"></pre>
<div id="bar">
  <span>◦ OFF GRID · <b>ऑफ़ ग्रिड</b> <button class="thm" id="thm">Ground: Paper</button></span>
  <b id="pr"></b>
</div>
<main id="m"></main>

<script>
// ==========================================================================
// OFF GRID CONFIGURATION & 10 QUESTIONS
// ==========================================================================
const EVENT = {
  name: "OFF GRID",
  devanagari: "ऑफ़ ग्रिड",
  meta: "16:00 — 19:00 IST · Bengaluru Coworking Terrace",
  prop: "The pause is the product. · अंतराल ही उत्पाद है।"
};
const ENDPOINT = ""; // optional: POST URL for submissions

const Q = [
  { k: 'name', q: 'What name goes on the physical badge card?', t: 'text', ph: 'Your name or handle', req: 1 },
  { k: 'email', q: 'Where should entry confirmation be routed?', t: 'email', ph: 'you@workplace.com', req: 1 },
  { k: 'desk', q: 'What desk or screen are you stepping away from?', t: 'text', ph: 'Designer, founder, developer, legal, studio…' },
  { k: 'archetype', q: 'Choose your Analog Archetype badge (v1).', t: 'choice', o: [
    'The Observer',
    'Screen-Fatigued',
    'Zero-Ping Enforcer',
    'Silent Attendee',
    'Terrace Squatter',
    'Off-Duty Operator'
  ]},
  { k: 'can', q: 'Pick your cold can allocation for arrival.', t: 'choice', o: [
    'Diet Coke (iced)',
    'Classic Cola (iced)',
    'Sparkling Water (chilled)',
    'Ginger Tonic (cold)',
    'Bitter Lemon'
  ]},
  { k: 'posture', q: 'What is your conversational posture?', t: 'choice', o: [
    'Total silence (do not engage)',
    'Low-frequency observing',
    'Terrace ambient listening only',
    'Open to unhurried one-on-one talk'
  ]},
  { k: 'device', q: 'Device availability protocol (16:00 — 19:00).', t: 'choice', o: [
    'Airplane mode in bag',
    'Do Not Disturb (no haptics/pings)',
    'Screen face-down on table'
  ]},
  { k: 'arrive', q: 'When will you arrive at the register?', t: 'choice', o: [
    '16:00 Sharp (Full 3-hour disconnect)',
    '16:15 — 16:30 (Easing post-standup)',
    '16:45 — 17:15 (Before golden-hour)'
  ]},
  { k: 'energy', q: 'Workday saturation index at this moment.', t: 'range' },
  { k: 'refusal', q: 'Which workplace ritual are you consciously refusing today?', t: 'area', ph: 'The 5 PM sync, urgent DM pings, camera-on calls, performative networking…' }
];

const ans = { energy: 3 };
const EN = [
  '01 // Moderate sprint fatigue',
  '02 // Back-to-back sync saturation',
  '03 // High notification noise',
  '04 // Screen glare overload',
  '05 // Full workday exhaustion'
];

const $ = s => document.querySelector(s), m = $('#m');

// build sections
let h = `
<section id="s0">
  <div class="n">00 — MANIFESTO // INTERVAL MARK</div>
  <h1>${EVENT.name}<span class="hi">${EVENT.devanagari}</span></h1>
  <p class="s">
    ${EVENT.meta}<br><br>
    <strong>${EVENT.prop}</strong><br><br>
    A three-hour window to log off in public. With a cold can. Ten questions. One monumental lead shape that keeps mutating. Scroll to start.
  </p>
  <button class="nx" data-go="0">begin ↓</button>
</section>`;

Q.forEach((x, i) => {
  let f = '';
  if (x.t === 'text' || x.t === 'email') f = `<input type="${x.t === 'text' ? 'text' : 'email'}" data-k="${x.k}" placeholder="${x.ph}" autocomplete="off">`;
  if (x.t === 'area') f = `<textarea rows="3" data-k="${x.k}" placeholder="${x.ph}"></textarea>`;
  if (x.t === 'choice' || x.t === 'multi') f = `<div class="chips" data-k="${x.k}" data-t="${x.t}">${x.o.map(o => `<button class="chip" data-v="${o}">${o}</button>`).join('')}</div>`;
  if (x.t === 'range') f = `<input type="range" min="1" max="5" value="3" data-k="${x.k}"><div class="rl" id="rl">${EN[2]}</div>`;
  h += `<section id="s${i + 1}"><div class="n">${String(i + 1).padStart(2, '0')} / 10</div><h2>${x.q}</h2>${f}<div class="h" id="h${i}"></div><button class="nx" data-go="${i + 1}">${i === 9 ? 'review' : 'continue'} ↓</button></section>`;
});

h += `
<section id="s11">
  <div class="n">DONE — ALMOST</div>
  <h2>Ready to lock it in?</h2>
  <p class="s">Your answers stay on this page until you confirm them.</p>
  <button class="chip sel" id="sub" style="align-self:flex-start">Issue Entry Pass</button>
  <div class="h" id="fh"></div>
  <pre id="out" hidden></pre>
</section>`;

m.innerHTML = h;
const secs = [...m.children], N = secs.length;

// interactions
const go = i => secs[Math.min(i + 1, N - 1)].scrollIntoView({ behavior: 'smooth' });

function ok(i) {
  const x = Q[i], v = ans[x.k], hint = $('#h' + i);
  if (hint) hint.textContent = '';
  if (x.req && !(v && v.trim()) || x.t === 'email' && v && !/^\S+@\S+\.\S+$/.test(v)) {
    if (hint) hint.textContent = x.t === 'email' ? '→ that email looks off' : '→ we need this one';
    const el = secs[i + 1].querySelector('input');
    if (el) {
      el.classList.remove('sh');
      void el.offsetWidth;
      el.classList.add('sh');
      el.focus();
    }
    return false;
  }
  return true;
}

m.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.go !== undefined) {
    const i = +b.dataset.go;
    if (i > 0 && !ok(i - 1)) return;
    go(i);
    return;
  }
  if (b.classList.contains('chip') && b.parentNode.dataset.k) {
    const p = b.parentNode, k = p.dataset.k;
    if (p.dataset.t === 'choice' || !p.dataset.t) {
      p.querySelectorAll('.chip').forEach(c => c.classList.remove('sel'));
      b.classList.add('sel');
      ans[k] = b.dataset.v;
      setTimeout(() => go(+p.closest('section').id.slice(1)), 380);
    } else {
      b.classList.toggle('sel');
      ans[k] = [...p.querySelectorAll('.sel')].map(c => c.dataset.v);
    }
  }
});

m.addEventListener('input', e => {
  const k = e.target.dataset.k;
  if (!k) return;
  ans[k] = e.target.value;
  if (e.target.type === 'range') {
    const idx = Math.max(0, Math.min(4, +e.target.value - 1));
    $('#rl').textContent = EN[idx];
  }
});

m.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('input[type=text], input[type=email]')) {
    e.preventDefault();
    const i = +e.target.closest('section').id.slice(1);
    if (ok(i - 1)) go(i);
  }
});

$('#sub').onclick = async () => {
  for (let i = 0; i < Q.length; i++) {
    if (Q[i].req && !ok(i)) {
      secs[i + 1].scrollIntoView({ behavior: 'smooth' });
      return;
    }
  }
  const out = $('#out'), fh = $('#fh');
  out.hidden = false;
  out.textContent = JSON.stringify({
    brand: "OFF GRID · ऑफ़ ग्रिड",
    window: "16:00 — 19:00 IST",
    ground: document.documentElement.dataset.theme || "paper",
    answers: ans
  }, null, 2);

  try {
    if (ENDPOINT) {
      await fetch(ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(ans)
      });
    }
    fh.textContent = '✓ You’re on the register' + (ENDPOINT ? '' : ' (offline payload generated below)');
    $('#sub').textContent = 'Pass Issued ✓';
  } catch (_) {
    fh.textContent = '→ couldn’t send, copy your pass below';
  }
};

// reveal
const io = new IntersectionObserver(es => es.forEach(x => x.target.classList.toggle('on', x.isIntersecting)), { threshold: .45 });
secs.forEach(s => io.observe(s));

// Ground Theme Switcher
const thmBtn = $('#thm');
const groundModes = ['paper', 'golden-hour', 'dark'];
let gIdx = 0;
thmBtn.onclick = () => {
  gIdx = (gIdx + 1) % groundModes.length;
  const mode = groundModes[gIdx];
  if (mode === 'paper') {
    delete document.documentElement.dataset.theme;
    thmBtn.textContent = 'Ground: Paper';
  } else if (mode === 'golden-hour') {
    document.documentElement.dataset.theme = 'golden-hour';
    thmBtn.textContent = 'Ground: Cobalt (17:15)';
  } else {
    document.documentElement.dataset.theme = 'dark';
    thmBtn.textContent = 'Ground: Ink';
  }
};

// Auto Golden-Hour Check (17:15 — 18:50 Bengaluru Local)
function checkGoldenHour() {
  try {
    const now = new Date();
    const parts = new Intl.DateTimeFormat([], { timeZone: 'Asia/Kolkata', hour12: false, hour: 'numeric', minute: 'numeric' }).formatToParts(now);
    const h = +parts.find(p => p.type === 'hour').value;
    const m = +parts.find(p => p.type === 'minute').value;
    const mins = h * 60 + m;
    if (mins >= 1035 && mins <= 1130) {
      document.documentElement.dataset.theme = 'golden-hour';
      thmBtn.textContent = 'Ground: Cobalt (17:15)';
      gIdx = 1;
    }
  } catch (e) {}
}
checkGoldenHour();

// ==========================================================================
// ASCII MORPH ANIMATION ENGINE (Referencing attached file visual storytelling)
// One lead shape (The Interval Mark) that smoothly mutates through 10 questions
// Scaled significantly larger to fill the left stage
// ==========================================================================
const COLS = 70, ROWS = 34, TAU = Math.PI * 2, RAMP = ' .·:-=+*#%@';

const ng = (n, off, R) => t => {
  const w = TAU / n, a = (((t - off) % w) + w) % w - w / 2;
  return R * Math.cos(Math.PI / n) / Math.cos(a);
};

// 12 Continuous Mutating Shapes for OFF GRID:
// 00: Lead Form — The Interval Mark (Square with notched corner)
// 01: Identification Card Badge Pass
// 02: Signal Wave Antenna / Pulse
// 03: Corporate Tower Monolith
// 04: Analog Archetype Hexagon
// 05: Cold Can
// 06: Pause Bars (||)
// 07: Shielded Device Enclosure
// 08: Time-Block Dial (16:00 — 19:00 Arc)
// 09: Workday Saturation Gauge
// 10: Severed Terminal Ring
// 11: Final Interval Mark Block
const SH = [
  // 00: The Interval Mark (Notched square)
  t => {
    const sq = ng(4, Math.PI / 4, 1.0)(t);
    return (t > 0.3 && t < 1.3) ? sq * 0.72 : sq;
  },
  // 01: ID Badge Card Pass
  ng(4, Math.PI / 2, 0.98),
  // 02: Signal Wave Antenna
  t => 0.75 + 0.32 * Math.cos(3 * t),
  // 03: Corporate Tower Monolith
  ng(4, Math.PI / 4, 0.85),
  // 04: 6 Archetypes Hexagon
  ng(6, 0, 0.96),
  // 05: Cold Can
  t => 0.68 + 0.28 * Math.cos(4 * t),
  // 06: Pause Bars (||)
  t => 0.62 + 0.34 * Math.cos(2 * t) * Math.cos(2 * t),
  // 07: Shielded Device Enclosure
  ng(5, Math.PI / 2, 0.92),
  // 08: Time-Block Chronometer Dial
  t => (t > -1.1 && t < 1.7) ? 0.98 : 0.48,
  // 09: Saturation Gauge
  t => {
    const s = Math.sin(t), c = Math.cos(t);
    return (2 - 2 * s + s * Math.sqrt(Math.abs(c)) / (s + 1.4)) * 0.34;
  },
  // 10: Severed Terminal
  t => (t > 0.8 && t < 1.4) ? 0.42 : 0.96,
  // 11: The Interval Mark / Conclusion
  t => {
    const sq = ng(4, Math.PI / 4, 1.0)(t);
    return (t > 0.3 && t < 1.3) ? sq * 0.72 : sq;
  }
];

const pre = $('#a'), pr = $('#pr');
let cur = 0, tgt = 0, T = 0, last = '';
const sm = x => x * x * (3 - 2 * x);

function fit() {
  const mob = innerWidth <= 800, w = mob ? innerWidth : innerWidth * .52;
  const fs = Math.min(w * .96 / (COLS * .6), innerHeight * .92 / (ROWS * 1.2));
  pre.style.fontSize = fs + 'px';
}

function scroll() {
  tgt = Math.max(0, Math.min(N - 1, scrollY / innerHeight));
}

addEventListener('resize', () => { fit(); scroll(); });
addEventListener('scroll', scroll, { passive: true });
fit();
scroll();

const rm = matchMedia('(prefers-reduced-motion:reduce)').matches;

// Shape Scale Multiplier: 1.35x ensures the shape is monumental and commands the left screen
const SCALE = 1.35;

function frame(ms) {
  T = ms / 1000;
  cur += (tgt - cur) * (rm ? 1 : 0.09);

  const i = Math.min(N - 2, Math.floor(cur));
  const f = sm(Math.max(0, Math.min(1, (cur - i - .2) / .65)));
  const A = SH[i], B = SH[i + 1];
  const sway = rm ? 0 : Math.sin(T * .5) * .12;

  let s = '';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const dx = (c - COLS / 2 + .5) * .5 / (ROWS / 2);
      const dy = (r - ROWS / 2 + .5) / (ROWS / 2);
      const p = Math.hypot(dx, dy);
      const th = Math.atan2(-dy, dx) + sway;

      const R = (A(th) * (1 - f) + B(th) * f) * SCALE;
      const d = p / R;

      if (d < 1) {
        let v = Math.pow(1 - d, .55) + .14 * Math.sin(p * 11 - T * 2.2) + .06 * Math.sin(th * 3 + T);
        s += d > .9 ? '#' : RAMP[Math.max(1, Math.min(RAMP.length - 1, (v * (RAMP.length - 1)) | 0))];
      } else {
        const q = Math.sin(c * 12.9898 + r * 78.233 + Math.floor(T * 1.5) * 3.17) * 43758.5453;
        s += (q - Math.floor(q)) < .025 ? '·' : ' ';
      }
    }
    s += '\n';
  }

  if (s !== last) {
    pre.textContent = s;
    last = s;
  }

  const step = Math.round(cur);
  const n = Math.max(0, Math.min(10, step));
  const bar = '▓'.repeat(n) + '░'.repeat(10 - n);
  pr.textContent = `${bar} ${String(n).padStart(2, '0')}/10`;

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
