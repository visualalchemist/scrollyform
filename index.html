<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OFF GRID · ऑफ़ ग्रिड — Save your spot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wght@400;600;700;800&family=Anek+Latin:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Diet Coke can palette, sampled from the reference image */
  --c:#E4062A;         /* Coke red */
  --bg:#D4D5D8;        /* brushed silver */
  --fg:#0E0E0F;        /* script black */
  --dim:#5E6165;       /* shadow steel */
  --on:#fff;           /* text on accent */
  --silver-lt:#E9EAEC;
  --white:#fff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme]){--bg:#0E0E0F;--fg:#E9EAEC;--dim:#92969A;--c:#E4062A;--on:#fff}
}
:root[data-theme="dark"]{--bg:#0E0E0F;--fg:#E9EAEC;--dim:#92969A;--c:#E4062A;--on:#fff}
:root[data-theme="golden-hour"]{--bg:#E4062A;--fg:#fff;--dim:#F8C4CB;--c:#fff;--on:#E4062A}
:root[data-theme="paper"]{--bg:#D4D5D8;--fg:#0E0E0F;--dim:#5E6165;--c:#E4062A;--on:#fff}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font:16px/1.55 'Anek Latin','Anek Devanagari',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  transition:background .4s, color .4s;
  -webkit-font-smoothing:antialiased
}
#a{
  position:fixed;
  left:0;
  top:0;
  width:52vw;
  height:100%;
  margin:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--c);
  white-space:pre;
  line-height:1.2;
  pointer-events:none;
  z-index:0;
  transition:color .6s;
  overflow:hidden;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace
}
#bar{
  position:fixed;
  top:env(safe-area-inset-top,0px);
  left:0;
  right:0;
  padding:14px 22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12px;
  letter-spacing:.08em;
  color:var(--dim);
  z-index:5;
  text-transform:uppercase
}
#bar b{color:var(--c);font-weight:500;white-space:pre}
#bar .thm{
  background:none;
  border:1px solid var(--dim);
  color:var(--fg);
  font:inherit;
  font-size:10px;
  padding:2px 8px;
  cursor:pointer;
  letter-spacing:.08em;
  text-transform:uppercase;
  margin-left:12px;
  border-radius:4px;
  transition:all .2s
}
#bar .thm:hover{background:var(--c);color:var(--on);border-color:var(--c)}
main{position:relative;z-index:2;margin-left:50vw;width:46vw}
section{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:90px 0;
  opacity:.18;
  transform:translateY(24px);
  transition:opacity .6s,transform .6s
}
section.on{opacity:1;transform:none}
.n{color:var(--c);font-size:13px;letter-spacing:.14em;margin-bottom:14px}
h1,h2{font-weight:700;margin:0 0 28px;letter-spacing:-.03em;line-height:1.05}
h1{font-size:clamp(40px,6vw,84px)}
h1 .hi{display:block;font-family:'Anek Devanagari';font-size:clamp(34px,5.2vw,72px);color:var(--c);margin-top:2px}
h2{font-size:clamp(28px,3.6vw,50px)}
p.s{color:var(--dim);margin:0 0 24px;max-width:38ch;font-size:15px;line-height:1.6}
input[type=text],input[type=email],textarea{
  width:100%;
  background:none;
  border:0;
  border-bottom:2px solid var(--dim);
  color:var(--fg);
  font:inherit;
  font-size:clamp(18px,2vw,26px);
  padding:10px 0;
  outline:0;
  border-radius:0;
  transition:border-color .3s;
  resize:none
}
input:focus,textarea:focus{border-color:var(--c)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{
  background:none;
  border:1.5px solid var(--dim);
  color:var(--fg);
  font:inherit;
  padding:10px 18px;
  cursor:pointer;
  border-radius:999px;
  transition:all .2s;
  display:flex;
  align-items:center;
  gap:10px
}
.chip:hover{border-color:var(--c)}
.chip.sel{background:var(--c);border-color:var(--c);color:var(--on);font-weight:600}
input[type=range]{width:100%;accent-color:var(--c);cursor:pointer}
.rl{color:var(--c);font-size:20px;margin-top:8px}
.nx{
  align-self:flex-start;
  margin-top:30px;
  background:none;
  border:0;
  color:var(--fg);
  font:inherit;
  cursor:pointer;
  padding:6px 0;
  border-bottom:1.5px solid var(--c);
  letter-spacing:.04em;
  text-transform:uppercase
}
.nx:hover{color:var(--c)}
.h{color:var(--c);font-size:13px;min-height:20px;margin-top:10px}
#out{
  white-space:pre-wrap;
  word-break:break-word;
  font-size:12px;
  color:var(--dim);
  border:1px dashed var(--dim);
  padding:14px;
  margin-top:20px;
  max-height:40vh;
  overflow:auto
}
.sh{animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (max-width:800px){
  #a{width:100%;opacity:.22}
  main{margin:0;width:auto;padding:0 24px}
}
@media (prefers-reduced-motion:reduce){section{transition:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<pre id="a" aria-hidden="true"></pre>
<div id="bar">
  <span>◦ OFF GRID · <b>ऑफ़ ग्रिड</b> <button class="thm" id="thm">Ground: Silver</button></span>
  <b id="pr"></b>
</div>
<main id="m"></main>

<script>
// ==========================================================================
// OFF GRID CONFIGURATION & 10 QUESTIONS
// ==========================================================================
const EVENT = {
  name: "OFF GRID",
  devanagari: "ऑफ़ ग्रिड",
  meta: "4 to 7 PM · Bengaluru coworking terrace",
  prop: "The pause is the product. · अंतराल ही उत्पाद है।"
};
const ENDPOINT = ""; // optional: POST URL for submissions

const Q = [
  { k: 'name', q: 'What should we put on your name card?', t: 'text', ph: 'Your name, or whatever you go by', req: 1 },
  { k: 'email', q: 'Where do we send your entry pass?', t: 'email', ph: 'you@wherever.com', req: 1 },
  { k: 'desk', q: 'Which screen are you escaping?', t: 'text', ph: 'Design, code, spreadsheets, one very long email thread…' },
  { k: 'archetype', q: 'Pick your analog archetype card.', t: 'choice', o: [
    'The Observer',
    'Screen-Tired',
    'Zero-Ping Enforcer',
    'The Quiet One',
    'Terrace Squatter',
    'Off-Duty Operator'
  ]},
  { k: 'can', q: 'Which cold can is yours?', t: 'choice', o: [
    'Diet Coke, ice cold',
    'Classic Cola, ice cold',
    'Sparkling water, chilled',
    'Ginger tonic',
    'Bitter Lemon'
  ]},
  { k: 'posture', q: 'How chatty are you feeling?', t: 'choice', o: [
    'Silent mode, please',
    'Just watching, thanks',
    'Happy to just listen to the terrace',
    'Up for a slow chat, one on one'
  ]},
  { k: 'device', q: 'Where is your phone going for three hours?', t: 'choice', o: [
    'In my bag, airplane mode on',
    'Do Not Disturb, no buzzing',
    'Face-down on the table'
  ]},
  { k: 'arrive', q: 'When are you rolling in?', t: 'choice', o: [
    '4:00 sharp, all three hours',
    '4:15 to 4:30, fresh out of standup',
    '4:45 to 5:15, in time for golden hour'
  ]},
  { k: 'energy', q: 'How fried is your brain right now?', t: 'range' },
  { k: 'refusal', q: 'What are you gleefully skipping today?', t: 'area', ph: 'The 5 PM sync, quick-question DMs, camera-on calls, networking with a script…' }
];

const ans = { energy: 3 };
const EN = [
  '01 // A little crispy',
  '02 // Meeting soup',
  '03 // Hearing pings in my sleep',
  '04 // Squinting at everything',
  '05 // Fully toasted'
];

const $ = s => document.querySelector(s), m = $('#m');

// build sections
let h = `
<section id="s0">
  <div class="n">00 — HELLO, YOU</div>
  <h1>${EVENT.name}<span class="hi">${EVENT.devanagari}</span></h1>
  <p class="s">
    ${EVENT.meta}<br><br>
    <strong>${EVENT.prop}</strong><br><br>
    Three hours. One cold can. Zero pings. Answer ten quick questions and we’ll save you a spot. The shape on the left will keep changing its mind, so don’t get attached. Scroll to start.
  </p>
  <button class="nx" data-go="0">let’s go ↓</button>
</section>`;

Q.forEach((x, i) => {
  let f = '';
  if (x.t === 'text' || x.t === 'email') f = `<input type="${x.t === 'text' ? 'text' : 'email'}" data-k="${x.k}" placeholder="${x.ph}" autocomplete="off">`;
  if (x.t === 'area') f = `<textarea rows="3" data-k="${x.k}" placeholder="${x.ph}"></textarea>`;
  if (x.t === 'choice' || x.t === 'multi') f = `<div class="chips" data-k="${x.k}" data-t="${x.t}">${x.o.map(o => `<button class="chip" data-v="${o}">${o}</button>`).join('')}</div>`;
  if (x.t === 'range') f = `<input type="range" min="1" max="5" value="3" data-k="${x.k}"><div class="rl" id="rl">${EN[2]}</div>`;
  h += `<section id="s${i + 1}"><div class="n">${String(i + 1).padStart(2, '0')} / 10</div><h2>${x.q}</h2>${f}<div class="h" id="h${i}"></div><button class="nx" data-go="${i + 1}">${i === 9 ? 'almost there' : 'next'} ↓</button></section>`;
});

h += `
<section id="s11">
  <div class="n">ONE LAST THING</div>
  <h2>Ready to log off?</h2>
  <p class="s">Nothing leaves this page until you say so.</p>
  <button class="chip sel" id="sub" style="align-self:flex-start">Get my entry pass</button>
  <div class="h" id="fh"></div>
  <pre id="out" hidden></pre>
</section>`;

m.innerHTML = h;
const secs = [...m.children], N = secs.length;

// interactions
const go = i => secs[Math.min(i + 1, N - 1)].scrollIntoView({ behavior: 'smooth' });

function ok(i) {
  const x = Q[i], v = ans[x.k], hint = $('#h' + i);
  if (hint) hint.textContent = '';
  if (x.req && !(v && v.trim()) || x.t === 'email' && v && !/^\S+@\S+\.\S+$/.test(v)) {
    if (hint) hint.textContent = x.t === 'email' ? '→ hmm, that email looks off' : '→ we do need this one, promise';
    const el = secs[i + 1].querySelector('input');
    if (el) {
      el.classList.remove('sh');
      void el.offsetWidth;
      el.classList.add('sh');
      el.focus();
    }
    return false;
  }
  return true;
}

m.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.go !== undefined) {
    const i = +b.dataset.go;
    if (i > 0 && !ok(i - 1)) return;
    go(i);
    return;
  }
  if (b.classList.contains('chip') && b.parentNode.dataset.k) {
    const p = b.parentNode, k = p.dataset.k;
    if (p.dataset.t === 'choice' || !p.dataset.t) {
      p.querySelectorAll('.chip').forEach(c => c.classList.remove('sel'));
      b.classList.add('sel');
      ans[k] = b.dataset.v;
      setTimeout(() => go(+p.closest('section').id.slice(1)), 380);
    } else {
      b.classList.toggle('sel');
      ans[k] = [...p.querySelectorAll('.sel')].map(c => c.dataset.v);
    }
  }
});

m.addEventListener('input', e => {
  const k = e.target.dataset.k;
  if (!k) return;
  ans[k] = e.target.value;
  if (e.target.type === 'range') {
    const idx = Math.max(0, Math.min(4, +e.target.value - 1));
    $('#rl').textContent = EN[idx];
  }
});

m.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('input[type=text], input[type=email]')) {
    e.preventDefault();
    const i = +e.target.closest('section').id.slice(1);
    if (ok(i - 1)) go(i);
  }
});

$('#sub').onclick = async () => {
  for (let i = 0; i < Q.length; i++) {
    if (Q[i].req && !ok(i)) {
      secs[i + 1].scrollIntoView({ behavior: 'smooth' });
      return;
    }
  }
  const out = $('#out'), fh = $('#fh');
  out.hidden = false;
  out.textContent = JSON.stringify({
    brand: "OFF GRID · ऑफ़ ग्रिड",
    window: "16:00 — 19:00 IST",
    ground: document.documentElement.dataset.theme || "paper",
    answers: ans
  }, null, 2);

  try {
    if (ENDPOINT) {
      await fetch(ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(ans)
      });
    }
    fh.textContent = '✓ You’re in. See you on the terrace' + (ENDPOINT ? '' : ' (no endpoint set, so your pass is below)');
    $('#sub').textContent = 'You’re in ✓';
  } catch (_) {
    fh.textContent = '→ that didn’t send, copy your pass below and try again';
  }
};

// reveal
const io = new IntersectionObserver(es => es.forEach(x => x.target.classList.toggle('on', x.isIntersecting)), { threshold: .45 });
secs.forEach(s => io.observe(s));

// Ground Theme Switcher
const thmBtn = $('#thm');
const groundModes = ['paper', 'golden-hour', 'dark'];
let gIdx = matchMedia('(prefers-color-scheme:dark)').matches ? 2 : 0;
thmBtn.textContent = ['Ground: Silver','Ground: Red (17:15)','Ground: Black'][gIdx];
thmBtn.onclick = () => {
  gIdx = (gIdx + 1) % groundModes.length;
  const mode = groundModes[gIdx];
  if (mode === 'paper') {
    document.documentElement.dataset.theme = 'paper';
    thmBtn.textContent = 'Ground: Silver';
  } else if (mode === 'golden-hour') {
    document.documentElement.dataset.theme = 'golden-hour';
    thmBtn.textContent = 'Ground: Red (17:15)';
  } else {
    document.documentElement.dataset.theme = 'dark';
    thmBtn.textContent = 'Ground: Black';
  }
};

// Auto Golden-Hour Check (17:15 — 18:50 Bengaluru Local)
function checkGoldenHour() {
  try {
    const now = new Date();
    const parts = new Intl.DateTimeFormat([], { timeZone: 'Asia/Kolkata', hour12: false, hour: 'numeric', minute: 'numeric' }).formatToParts(now);
    const h = +parts.find(p => p.type === 'hour').value;
    const m = +parts.find(p => p.type === 'minute').value;
    const mins = h * 60 + m;
    if (mins >= 1035 && mins <= 1130) {
      document.documentElement.dataset.theme = 'golden-hour';
      thmBtn.textContent = 'Ground: Red (17:15)';
      gIdx = 1;
    }
  } catch (e) {}
}
checkGoldenHour();

// ==========================================================================
// ASCII MORPH ANIMATION ENGINE (Referencing attached file visual storytelling)
// One lead shape (The Interval Mark) that smoothly mutates through 10 questions
// Scaled significantly larger to fill the left stage
// ==========================================================================
const COLS = 70, ROWS = 34, TAU = Math.PI * 2, RAMP = ' .·:-=+*#%@';

const ng = (n, off, R) => t => {
  const w = TAU / n, a = (((t - off) % w) + w) % w - w / 2;
  return R * Math.cos(Math.PI / n) / Math.cos(a);
};

// Shapes are signed-distance functions (y up) so real objects can morph into each other.
const L = Math.hypot, mx = Math.max, mn = Math.min, ab = Math.abs;
const box = (x, y, cx, cy, w, h, r = 0) => { const qx = ab(x - cx) - w + r, qy = ab(y - cy) - h + r; return L(mx(qx, 0), mx(qy, 0)) + mn(mx(qx, qy), 0) - r };
const circ = (x, y, cx, cy, r) => L(x - cx, y - cy) - r;
const ring = (x, y, r, t) => ab(L(x, y) - r) - t;
const cap = (x, y, ax, ay, bx, by, r) => { const px = x - ax, py = y - ay, u = bx - ax, v = by - ay, k = mx(0, mn(1, (px * u + py * v) / (u * u + v * v))); return L(px - u * k, py - v * k) - r };
const sub = (a, b) => mx(a, -b);
const hexa = (x, y) => { const t = Math.atan2(y, x), w = TAU / 6, a = (((t) % w) + w) % w - w / 2; return L(x, y) - .86 * Math.cos(Math.PI / 6) / Math.cos(a) };
const mark = (x, y) => sub(box(x, y, 0, 0, .72, .72, .04), box(x, y, .72, .72, .34, .34));

const SH = [
  mark,                                                                   // 00 Interval Mark (notched square)
  (x, y) => sub(sub(sub(box(x, y, 0, 0, .5, .82, .08), box(x, y, 0, .66, .14, .03)), circ(x, y, 0, .2, .22)), box(x, y, 0, -.36, .3, .05)), // 01 badge card
  (x, y) => mn(circ(x, y, 0, -.45, .1), mn(...[.4, .7, .95].map(r => mx(ring(x, y + .45, r, .06), -(y + .45))))), // 02 signal arcs
  (x, y) => mn(box(x, y, .12, 0, .26, .92), mn(box(x, y, -.5, -.4, .2, .5), box(x, y, .5, -.55, .14, .35))),    // 03 tower
  (x, y) => sub(hexa(x, y), circ(x, y, 0, 0, .17)),                       // 04 archetype hexagon
  (x, y) => sub(sub(sub(box(x, y, 0, 0, .4, .82, .07), box(x, y, 0, .52, .4, .025)), box(x, y, 0, -.52, .4, .025)), box(x, y, 0, .82, .24, .05)), // 05 cold can
  (x, y) => mn(box(x, y, -.34, 0, .17, .72, .04), box(x, y, .34, 0, .17, .72, .04)), // 06 pause bars
  (x, y) => mn(sub(box(x, y, 0, 0, .42, .84, .12), box(x, y, 0, -.04, .34, .66, .04)), circ(x, y, 0, 0, .15)),  // 07 device, shielded
  (x, y) => mn(ring(x, y, .8, .07), mn(cap(x, y, 0, 0, .4, .42, .07), circ(x, y, 0, 0, .1))),                 // 08 time dial
  (x, y) => mn(mx(ring(x, y + .3, .82, .1), -(y + .3)), mn(cap(x, y, 0, -.3, .42, .12, .06), mn(circ(x, y, 0, -.3, .13), box(x, y, 0, -.55, .88, .035)))), // 09 saturation gauge
  (x, y) => { const t = Math.atan2(y, x), d = ring(x, y, .78, .1); return mn(mx(d, (.24 - ab(t - .8)) * .8), circ(x, y, 0, 0, .08)) }, // 10 severed ring
  mark                                                                    // 11 Interval Mark, closed out
];

const pre = $('#a'), pr = $('#pr');
let cur = 0, tgt = 0, T = 0, last = '';
const sm = x => x * x * (3 - 2 * x);

function fit() {
  const mob = innerWidth <= 800, w = mob ? innerWidth : innerWidth * .52;
  const fs = Math.min(w * .96 / (COLS * .6), innerHeight * .92 / (ROWS * 1.2));
  pre.style.fontSize = fs + 'px';
}

function scroll() {
  tgt = Math.max(0, Math.min(N - 1, scrollY / innerHeight));
}

addEventListener('resize', () => { fit(); scroll(); });
addEventListener('scroll', scroll, { passive: true });
fit();
scroll();

const rm = matchMedia('(prefers-reduced-motion:reduce)').matches;


function frame(ms) {
  T = ms / 1000;
  cur += (tgt - cur) * (rm ? 1 : 0.09);

  const i = Math.min(N - 2, Math.floor(cur));
  const f = sm(Math.max(0, Math.min(1, (cur - i - .2) / .65)));
  const A = SH[i], B = SH[i + 1];
  const sway = rm ? 0 : Math.sin(T * .5) * .05, ca = Math.cos(sway), sa = Math.sin(sway);

  let s = '';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const dx = (c - COLS / 2 + .5) * .5 / (ROWS / 2);
      const dy = (r - ROWS / 2 + .5) / (ROWS / 2);
      const p = Math.hypot(dx, dy), x = dx * ca + dy * sa, y = -dy * ca + dx * sa;
      const d = A(x, y) * (1 - f) + B(x, y) * f;

      if (d < 0) {
        const dep = mn(1, -d * 3.2);
        const v = Math.pow(dep, .6) + .14 * Math.sin(p * 11 - T * 2.2) + .06 * Math.sin(Math.atan2(y, x) * 3 + T);
        s += -d < .03 ? '#' : RAMP[Math.max(1, Math.min(RAMP.length - 1, (v * (RAMP.length - 1)) | 0))];
      } else {
        const q = Math.sin(c * 12.9898 + r * 78.233 + Math.floor(T * 1.5) * 3.17) * 43758.5453;
        s += (q - Math.floor(q)) < .025 ? '·' : ' ';
      }
    }
    s += '\n';
  }

  if (s !== last) {
    pre.textContent = s;
    last = s;
  }

  const step = Math.round(cur);
  const n = Math.max(0, Math.min(10, step));
  const bar = '▓'.repeat(n) + '░'.repeat(10 - n);
  pr.textContent = `${bar} ${String(n).padStart(2, '0')}/10`;

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
