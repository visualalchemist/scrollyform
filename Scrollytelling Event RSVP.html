<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RSVP — Scroll to Join</title>
<style>
:root{--c:#ff5a36;--bg:#f4f1ea;--fg:#16150f;--dim:#8a8678;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0b;--fg:#ece9e2;--dim:#7d7a70}}
:root[data-theme="dark"]{--bg:#0a0a0b;--fg:#ece9e2;--dim:#7d7a70}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;transition:background .4s}
#a{position:fixed;left:0;top:0;width:52vw;height:100%;margin:0;display:flex;align-items:center;justify-content:center;color:var(--c);white-space:pre;line-height:1.2;pointer-events:none;z-index:0;transition:color .6s;overflow:hidden}
#bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;padding:14px 22px;display:flex;justify-content:space-between;font-size:12px;letter-spacing:.08em;color:var(--dim);z-index:5;text-transform:uppercase}
#bar b{color:var(--c);font-weight:400;white-space:pre}
main{position:relative;z-index:2;margin-left:50vw;width:46vw}
section{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:90px 0;opacity:.18;transform:translateY(24px);transition:opacity .6s,transform .6s}
section.on{opacity:1;transform:none}
.n{color:var(--c);font-size:13px;letter-spacing:.14em;margin-bottom:14px}
h1,h2{font-weight:400;margin:0 0 28px;letter-spacing:-.03em;line-height:1.05}
h1{font-size:clamp(40px,6vw,84px)}h2{font-size:clamp(28px,3.6vw,50px)}
p.s{color:var(--dim);margin:0 0 24px;max-width:36ch}
input[type=text],input[type=email],textarea{width:100%;background:none;border:0;border-bottom:2px solid var(--dim);color:var(--fg);font:inherit;font-size:clamp(18px,2vw,26px);padding:10px 0;outline:0;border-radius:0;transition:border-color .3s;resize:none}
input:focus,textarea:focus{border-color:var(--c)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:none;border:1.5px solid var(--dim);color:var(--fg);font:inherit;padding:10px 16px;cursor:pointer;border-radius:999px;transition:all .2s}
.chip:hover{border-color:var(--c)}
.chip.sel{background:var(--c);border-color:var(--c);color:var(--bg)}
input[type=range]{width:100%;accent-color:var(--c)}
.rl{color:var(--c);font-size:20px;margin-top:8px}
.nx{align-self:flex-start;margin-top:30px;background:none;border:0;color:var(--fg);font:inherit;cursor:pointer;padding:6px 0;border-bottom:1.5px solid var(--c)}
.nx:hover{color:var(--c)}
.h{color:var(--c);font-size:13px;min-height:20px;margin-top:10px}
#out{white-space:pre-wrap;word-break:break-word;font-size:12px;color:var(--dim);border:1px dashed var(--dim);padding:14px;margin-top:20px;max-height:40vh;overflow:auto}
.sh{animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (max-width:800px){
#a{width:100%;opacity:.22}
main{margin:0;width:auto;padding:0 24px}
}
@media (prefers-reduced-motion:reduce){section{transition:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<pre id="a" aria-hidden="true"></pre>
<div id="bar"><span>◦ RSVP</span><b id="pr"></b></div>
<main id="m"></main>

<script>
// ---- edit me ----
const EVENT = { name: "THE GATHERING", meta: "Date · Time · Venue" };
const ENDPOINT = ""; // optional: POST URL for submissions
// -----------------
const Q=[
{k:'name',q:'What should we call you?',t:'text',ph:'Your name',req:1},
{k:'email',q:'Where can we reach you?',t:'email',ph:'you@domain.com',req:1},
{k:'work',q:'What do you do, in one line?',t:'text',ph:'Designer, founder, student…'},
{k:'role',q:'How are you joining us?',t:'choice',o:['Attendee','Speaker','Partner','Press']},
{k:'topics',q:'What pulls you in? Pick any.',t:'multi',o:['Talks','Workshops','Demos','Networking','Music','Food']},
{k:'diet',q:'How should we feed you?',t:'choice',o:['No preference','Vegetarian','Vegan','Allergy — I’ll tell you']},
{k:'arrive',q:'When will you arrive?',t:'choice',o:['On the dot','Within the first hour','Fashionably late']},
{k:'guest',q:'Bringing someone?',t:'choice',o:['Just me','Plus one']},
{k:'energy',q:'How social are you feeling?',t:'range'},
{k:'note',q:'Leave us a note.',t:'area',ph:'What would make this unmissable for you?'}
];
const ans={energy:5},EN=['Hermit mode','Easing in','Warm','Chatty','Electric'];
const $=s=>document.querySelector(s),m=$('#m');

// build sections
let h=`<section id="s0"><div class="n">00 — BEGIN</div><h1>${EVENT.name}</h1><p class="s">${EVENT.meta}<br>Ten questions. One shape that keeps changing. Scroll to start.</p><button class="nx" data-go="0">begin ↓</button></section>`;
Q.forEach((x,i)=>{
 let f='';
 if(x.t=='text'||x.t=='email')f=`<input type="${x.t=='text'?'text':'email'}" data-k="${x.k}" placeholder="${x.ph}" autocomplete="off">`;
 if(x.t=='area')f=`<textarea rows="3" data-k="${x.k}" placeholder="${x.ph}"></textarea>`;
 if(x.t=='choice'||x.t=='multi')f=`<div class="chips" data-k="${x.k}" data-t="${x.t}">${x.o.map(o=>`<button class="chip" data-v="${o}">${o}</button>`).join('')}</div>`;
 if(x.t=='range')f=`<input type="range" min="0" max="10" value="5" data-k="${x.k}"><div class="rl" id="rl">${EN[2]}</div>`;
 h+=`<section id="s${i+1}"><div class="n">${String(i+1).padStart(2,'0')} / 10</div><h2>${x.q}</h2>${f}<div class="h" id="h${i}"></div><button class="nx" data-go="${i+1}">${i==9?'review':'continue'} ↓</button></section>`;
});
h+=`<section id="s11"><div class="n">DONE — ALMOST</div><h2>Ready to lock it in?</h2><p class="s">Your answers stay on this page until you send them.</p><button class="chip sel" id="sub" style="align-self:flex-start">Submit RSVP</button><div class="h" id="fh"></div><pre id="out" hidden></pre></section>`;
m.innerHTML=h;
const secs=[...m.children],N=secs.length;

// interactions
const go=i=>secs[Math.min(i+1,N-1)].scrollIntoView({behavior:'smooth'});
function ok(i){ // validate question i (0-based)
 const x=Q[i],v=ans[x.k],hint=$('#h'+i);hint.textContent='';
 if(x.req&&!(v&&v.trim())||x.t=='email'&&v&&!/^\S+@\S+\.\S+$/.test(v)){
  hint.textContent=x.t=='email'?'→ that email looks off':'→ we need this one';
  const el=secs[i+1].querySelector('input');el.classList.remove('sh');void el.offsetWidth;el.classList.add('sh');el.focus();return false}
 return true}
m.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.go!==undefined){const i=+b.dataset.go;if(i>0&&!ok(i-1))return;go(i);return}
 if(b.classList.contains('chip')&&b.parentNode.dataset.k){
  const p=b.parentNode,k=p.dataset.k;
  if(p.dataset.t=='choice'){p.querySelectorAll('.chip').forEach(c=>c.classList.remove('sel'));b.classList.add('sel');ans[k]=b.dataset.v;setTimeout(()=>go(+p.closest('section').id.slice(1)),380)}
  else{b.classList.toggle('sel');ans[k]=[...p.querySelectorAll('.sel')].map(c=>c.dataset.v)}}
});
m.addEventListener('input',e=>{const k=e.target.dataset.k;if(!k)return;ans[k]=e.target.value;
 if(e.target.type=='range')$('#rl').textContent=EN[Math.min(4,e.target.value>>1)]});
m.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.matches('input[type=text],input[type=email]')){e.preventDefault();const i=+e.target.closest('section').id.slice(1);if(ok(i-1))go(i)}});
$('#sub').onclick=async()=>{
 for(let i=0;i<Q.length;i++)if(Q[i].req&&!ok(i)){secs[i+1].scrollIntoView();return}
 const out=$('#out'),fh=$('#fh');out.hidden=false;out.textContent=JSON.stringify(ans,null,2);
 try{if(ENDPOINT)await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(ans)});
  fh.textContent='✓ You’re on the list'+(ENDPOINT?'':' (no endpoint set — copy your answers below)');
  $('#sub').textContent='Sent'}catch(_){fh.textContent='→ couldn’t send, try again'}
};

// reveal
const io=new IntersectionObserver(es=>es.forEach(x=>x.target.classList.toggle('on',x.isIntersecting)),{threshold:.45});
secs.forEach(s=>io.observe(s));

// ---- ASCII morph ----
const COLS=70,ROWS=34,TAU=Math.PI*2,RAMP=' .·:-=+*#%@';
const ng=(n,off,R)=>t=>{const w=TAU/n,a=(((t-off)%w)+w)%w-w/2;return R*Math.cos(Math.PI/n)/Math.cos(a)};
const SH=[
 t=>.78, ng(3,Math.PI/2,.95), ng(4,Math.PI/4,.82), ng(4,Math.PI/2,.95),
 ng(5,Math.PI/2,.88), ng(6,0,.85), t=>.62+.26*Math.cos(5*t), t=>.56+.34*Math.cos(4*t),
 t=>{const s=Math.sin(t),c=Math.cos(t);return(2-2*s+s*Math.sqrt(Math.abs(c))/(s+1.4))*.27},
 t=>.6+.22*Math.cos(8*t), t=>.45+.4*Math.abs(Math.sin(3*t)), t=>.78
];
const pre=$('#a'),pr=$('#pr');
let cur=0,tgt=0,T=0,last='';
const sm=x=>x*x*(3-2*x);
function fit(){const mob=innerWidth<=800,w=mob?innerWidth:innerWidth*.52,fs=Math.min(w*.94/(COLS*.6),innerHeight*.86/(ROWS*1.2));pre.style.fontSize=fs+'px'}
function scroll(){tgt=Math.max(0,Math.min(N-1,scrollY/innerHeight))}
addEventListener('resize',()=>{fit();scroll()});addEventListener('scroll',scroll,{passive:true});
fit();scroll();
const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
function frame(ms){
 T=ms/1000;cur+=(tgt-cur)*(rm?1:.09);
 const i=Math.min(N-2,Math.floor(cur)),f=sm(Math.max(0,Math.min(1,(cur-i-.2)/.65))),A=SH[i],B=SH[i+1],sway=rm?0:Math.sin(T*.5)*.12;
 let s='';
 for(let r=0;r<ROWS;r++){
  for(let c=0;c<COLS;c++){
   const dx=(c-COLS/2+.5)*.5/(ROWS/2),dy=(r-ROWS/2+.5)/(ROWS/2),p=Math.hypot(dx,dy),th=Math.atan2(-dy,dx)+sway;
   const R=(A(th)*(1-f)+B(th)*f)*.95,d=p/R;
   if(d<1){
    let v=Math.pow(1-d,.55)+.14*Math.sin(p*11-T*2.2)+.06*Math.sin(th*3+T);
    s+=d>.9?'#':RAMP[Math.max(1,Math.min(RAMP.length-1,(v*(RAMP.length-1))|0))];
   }else{
    const q=Math.sin(c*12.9898+r*78.233+Math.floor(T*1.5)*3.17)*43758.5453;
    s+=(q-Math.floor(q))<.025?'·':' ';
   }
  }
  s+='\n';
 }
 if(s!==last){pre.textContent=s;last=s}
 const step=Math.round(cur),hue=(step*34+12)%360;
 document.documentElement.style.setProperty('--c',`hsl(${hue} 95% ${matchMedia('(prefers-color-scheme:dark)').matches?62:52}%)`);
 const n=Math.max(0,Math.min(10,step)),bar='▓'.repeat(n)+'░'.repeat(10-n);
 pr.textContent=`${bar} ${String(n).padStart(2,'0')}/10`;
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
