<style>
/* ==========================================================================
   OFF GRID BRAND SYSTEM V1 (RAP MEDIA · BENGALURU · OCTOBER 2026)
   Strict Color Palette & Architectural Monospace / Devanagari Typography
   ========================================================================== */
:root {
  --paper: #F3EEE2;
  --paper-cool: #E7E3D6;
  --ink: #0E1116;
  --scarlet: #E63323;
  --cobalt: #1D3BE0;
  --sun: #F6D32B;
  --white: #FFFFFF;

  --bg: var(--paper);
  --bg-alt: var(--paper-cool);
  --fg: var(--ink);
  --accent: var(--scarlet);
  --border: rgba(14, 17, 22, 0.2);
  --border-strong: var(--ink);
  --dim: #5c5950;
  --callout: var(--sun);

  box-sizing: border-box;
}

/* Golden Hour Rule (17:15 — 18:50 Bengaluru Local) */
[data-theme="golden-hour"], [data-theme="cobalt"] {
  --bg: var(--cobalt);
  --bg-alt: #132bb8;
  --fg: var(--paper);
  --accent: var(--sun);
  --border: rgba(243, 238, 226, 0.28);
  --border-strong: var(--paper);
  --dim: #b8c4e6;
  --callout: var(--sun);
}

[data-theme="ink"] {
  --bg: var(--ink);
  --bg-alt: #171c24;
  --fg: var(--paper);
  --accent: var(--scarlet);
  --border: rgba(243, 238, 226, 0.22);
  --border-strong: var(--paper);
  --dim: #969389;
  --callout: var(--sun);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html {
  scroll-behavior: smooth;
  scroll-padding-top: 60px;
  background-color: var(--bg);
  color: var(--fg);
}
body {
  font-family: 'Anek Latin', 'Anek Devanagari', -apple-system, BlinkMacSystemFont, sans-serif;
  background-color: var(--bg);
  color: var(--fg);
  line-height: 1.45;
  transition: background-color .35s ease, color .35s ease;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

.mono {
  font-family: 'JetBrains Mono', ui-monospace, monospace;
}

/* System Top Bar */
#top-bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 52px;
  background: var(--bg);
  border-bottom: 1.5px solid var(--border);
  padding: 0 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 1000;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-family: 'JetBrains Mono', monospace;
  transition: background-color .35s, border-color .35s;
}
.brand-title {
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand-title strong {
  color: var(--accent);
  font-weight: 700;
}
.bar-controls {
  display: flex;
  align-items: center;
  gap: 14px;
}
.time-pill {
  background: var(--bg-alt);
  border: 1px solid var(--border);
  padding: 4px 10px;
  font-size: 10.5px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.time-pill .live-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  display: inline-block;
  animation: pulse 2s infinite ease-in-out;
}
@keyframes pulse {
  0%, 100% { opacity: 0.3; transform: scale(0.85); }
  50% { opacity: 1; transform: scale(1.15); }
}
.btn-toggle {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--fg);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  padding: 5px 10px;
  cursor: pointer;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  transition: all .2s ease;
}
.btn-toggle:hover {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
}

/* Master Layout: 50vw Sticky ASCII Stage + 50vw Scrollytelling Narrative */
#layout {
  display: flex;
  min-height: 100vh;
  margin-top: 52px;
  position: relative;
}

/* ==========================================================================
   THE LEAD FORM ASCII ENGINE STAGE
   One single geometric form that continuously mutates through 10 questions
   ========================================================================== */
#stage {
  position: fixed;
  top: 52px;
  left: 0;
  width: 52vw;
  height: calc(100vh - 52px);
  border-right: 1.5px solid var(--border);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 36px 40px;
  pointer-events: none;
  z-index: 100;
  user-select: none;
  background: radial-gradient(circle at 45% 45%, transparent 60%, rgba(14, 17, 22, 0.03) 100%);
}

.stage-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}
.wordmark-group {
  display: flex;
  flex-direction: column;
}
.wordmark-latin {
  font-family: 'Anek Latin', sans-serif;
  font-size: clamp(40px, 5.2vw, 68px);
  font-weight: 800;
  line-height: 0.9;
  letter-spacing: -0.04em;
  color: var(--accent);
}
.wordmark-devanagari {
  font-family: 'Anek Devanagari', sans-serif;
  font-size: clamp(36px, 4.6vw, 60px);
  font-weight: 800;
  line-height: 0.95;
  letter-spacing: -0.02em;
  color: var(--fg);
  margin-top: 4px;
}
.prop-line {
  margin-top: 14px;
  font-size: 13.5px;
  font-weight: 500;
  color: var(--dim);
}
.prop-line .hi {
  display: block;
  font-family: 'Anek Devanagari', sans-serif;
  font-weight: 700;
  color: var(--fg);
  font-size: 15px;
  margin-top: 2px;
}

.stage-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  background: var(--bg-alt);
  border: 1px solid var(--border);
  padding: 6px 10px;
  text-align: right;
  line-height: 1.4;
  letter-spacing: 0.06em;
}

/* ASCII Screen Viewport */
#ascii-viewport {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  margin: 12px 0;
}
#ascii-canvas {
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 11px;
  line-height: 1.1;
  color: var(--accent);
  white-space: pre;
  text-align: center;
  transition: color 0.3s;
}

/* ASCII Telemetry Overlay */
.telemetry-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  color: var(--dim);
  border-top: 1px solid var(--border);
  padding-top: 14px;
  letter-spacing: 0.05em;
}
.morph-meter {
  display: flex;
  align-items: center;
  gap: 8px;
}
.morph-meter b {
  color: var(--fg);
}
.morph-bar-render {
  font-family: 'JetBrains Mono', monospace;
  color: var(--accent);
  font-size: 11px;
}

/* ==========================================================================
   SCROLLYTELLING NARRATIVE COLUMN (Right 48vw)
   ========================================================================== */
main {
  margin-left: 52vw;
  width: 48vw;
  padding: 40px 6vw 140px 5vw;
  position: relative;
  z-index: 200;
}

section {
  min-height: 94vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 60px 0;
  opacity: 0.18;
  transform: translateY(28px);
  transition: opacity 0.55s cubic-bezier(0.16, 1, 0.3, 1), transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
  border-bottom: 1px dashed var(--border);
}
section:last-of-type {
  border-bottom: 0;
  min-height: 85vh;
}
section.on {
  opacity: 1;
  transform: translateY(0);
}

.plate-header {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11.5px;
  color: var(--accent);
  letter-spacing: 0.14em;
  margin-bottom: 16px;
  text-transform: uppercase;
}
.plate-header .bars {
  font-weight: 800;
}

h1 {
  font-family: 'Anek Latin', sans-serif;
  font-size: clamp(36px, 4vw, 62px);
  font-weight: 800;
  line-height: 1.05;
  letter-spacing: -0.03em;
  margin-bottom: 22px;
}
h2 {
  font-family: 'Anek Latin', 'Anek Devanagari', sans-serif;
  font-size: clamp(26px, 2.8vw, 42px);
  font-weight: 700;
  line-height: 1.15;
  letter-spacing: -0.02em;
  margin-bottom: 20px;
}
p.manifesto {
  font-size: 17px;
  line-height: 1.6;
  margin-bottom: 24px;
  max-width: 44ch;
}
p.manifesto strong {
  color: var(--accent);
}
p.s {
  color: var(--dim);
  font-size: 14.5px;
  line-height: 1.55;
  margin-bottom: 26px;
  max-width: 42ch;
}

/* Form Inputs */
input[type=text], input[type=email], textarea {
  width: 100%;
  max-width: 480px;
  background: transparent;
  border: 0;
  border-bottom: 2px solid var(--border-strong);
  color: var(--fg);
  font-family: 'Anek Latin', 'Anek Devanagari', sans-serif;
  font-size: clamp(20px, 2vw, 28px);
  font-weight: 500;
  padding: 12px 0;
  outline: none;
  border-radius: 0;
  transition: border-color .2s;
}
input:focus, textarea:focus {
  border-color: var(--accent);
}
input::placeholder, textarea::placeholder {
  color: var(--dim);
  opacity: 0.55;
}
textarea {
  resize: none;
  font-size: 19px;
  line-height: 1.45;
}

/* Archetype & Option Chips */
.chips {
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100%;
  max-width: 500px;
}
.chip {
  background: var(--bg-alt);
  border: 1.5px solid var(--border);
  color: var(--fg);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13.5px;
  padding: 14px 18px;
  text-align: left;
  cursor: pointer;
  border-radius: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: all 0.18s ease;
}
.chip:hover {
  border-color: var(--accent);
  background: var(--bg);
}
.chip.sel {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
[data-theme="golden-hour"] .chip.sel, [data-theme="cobalt"] .chip.sel {
  background: var(--paper);
  color: var(--cobalt);
  border-color: var(--paper);
}
.chip .idx {
  font-size: 11px;
  opacity: 0.6;
}

/* Workday Saturation Range Slider */
.slider-unit {
  width: 100%;
  max-width: 480px;
  margin: 18px 0;
}
input[type=range] {
  width: 100%;
  height: 6px;
  background: var(--border);
  outline: none;
  accent-color: var(--accent);
  cursor: pointer;
}
.slider-data {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-top: 14px;
  font-family: 'JetBrains Mono', monospace;
}
.slider-val {
  font-size: 18px;
  font-weight: 700;
  color: var(--accent);
}
.slider-sub {
  font-size: 11.5px;
  color: var(--dim);
}

/* Nav Triggers & Primary Buttons */
.nx-btn {
  align-self: flex-start;
  margin-top: 36px;
  background: none;
  border: 0;
  color: var(--fg);
  font-family: 'JetBrains Mono', monospace;
  font-size: 12.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  padding: 6px 0;
  border-bottom: 2px solid var(--accent);
  transition: color .2s, border-color .2s;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.nx-btn:hover {
  color: var(--accent);
}
.primary-btn {
  align-self: flex-start;
  background: var(--accent);
  color: var(--paper);
  border: 0;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 16px 34px;
  cursor: pointer;
  transition: opacity .2s, transform .1s;
}
.primary-btn:hover {
  opacity: 0.92;
}
.primary-btn:active {
  transform: translateY(1px);
}

.hint {
  color: var(--accent);
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  min-height: 22px;
  margin-top: 12px;
}

/* Physical Badge Pass Output */
#badge-container {
  margin-top: 24px;
  background: var(--paper);
  color: var(--ink);
  border: 2px solid var(--ink);
  padding: 24px;
  font-family: 'JetBrains Mono', monospace;
  max-width: 480px;
}
.b-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  border-bottom: 2px solid var(--ink);
  padding-bottom: 12px;
  margin-bottom: 14px;
}
.b-mark {
  font-family: 'Anek Latin', sans-serif;
  font-size: 22px;
  font-weight: 800;
  color: var(--scarlet);
}
.b-meta {
  font-size: 10px;
  color: #5c5950;
  margin-top: 2px;
}
.b-row {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  padding: 6px 0;
  border-bottom: 1px dashed rgba(14, 17, 22, 0.22);
}
.b-row strong {
  font-weight: 700;
}
.b-foot {
  margin-top: 16px;
  padding-top: 10px;
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  color: #5c5950;
}

#payload-view {
  white-space: pre-wrap;
  word-break: break-word;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--dim);
  border: 1px dashed var(--border);
  padding: 16px;
  margin-top: 20px;
  max-height: 32vh;
  overflow: auto;
  background: var(--bg-alt);
}

/* Responsive Overrides */
@media (max-width: 960px) {
  #stage {
    position: fixed;
    top: 52px;
    left: 0;
    width: 100vw;
    height: 40vh;
    padding: 16px 20px;
    background: var(--bg);
    border-right: 0;
    border-bottom: 1.5px solid var(--border);
  }
  .wordmark-latin { font-size: 28px; }
  .wordmark-devanagari { font-size: 24px; }
  .prop-line { display: none; }
  #ascii-viewport { margin: 2px 0; }
  #ascii-canvas { font-size: 8px; line-height: 1.0; }
  .telemetry-row { display: none; }

  main {
    margin-left: 0;
    width: 100vw;
    padding: calc(40vh + 30px) 24px 80px 24px;
  }
  section {
    min-height: 80vh;
    padding: 30px 0;
  }
}

.shake { animation: sk 0.3s; }
@keyframes sk {
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}
</style>
</head>

  </div>
  <h1>The pause is the product.</h1>

    <strong>OFF GRID</strong> is a three-hour window inside a Bengaluru corporate & coworking terrace.

  <p class="s">
    No stage. No line-up. No main-character moment. No DJ, no ambient trance, no founder fireside, no networking theater.

  <button class="nx-btn" data-target="0">Open Register ↓</button>
</section>`;

QUESTIONS.forEach((q, i) => {
  let field = '';
  if (q.type === 'text' || q.type === 'email') {
    field = `<input type="${q.type}" data-key="${q.key}" placeholder="${q.placeholder}" autocomplete="off">`;
  } else if (q.type === 'area') {
    field = `<textarea rows="3" data-key="${q.key}" placeholder="${q.placeholder}"></textarea>`;
  } else if (q.type === 'choice') {
    field = `<div class="chips" data-key="${q.key}">
      ${q.options.map((opt, idx) => `

  htmlContent += `

    <button class="nx-btn" data-target="${i+1}">${i === 9 ? 'Review Entry Badge' : 'Next Plate'} ↓</button>

});

htmlContent += `
<section id="s11">
  <div class="plate-header">
    <span class="bars">||</span>
    <span>CONCLUSION // PHYSICAL PASS</span>
  </div>
  <h2>Issue Entry Badge.</h2>

narrative.innerHTML = htmlContent;
const sectionElements = [...narrative.children];
const totalPlates = sectionElements.length;

// Navigation & Validation
const navigateTo = idx => sectionElements[Math.min(idx + 1, totalPlates - 1)].scrollIntoView({ behavior: 'smooth' });

function validatePlate(idx) {
  const q = QUESTIONS[idx];
  const val = state[q.key];
  const hint = $('#hint-' + idx);
  if (hint) hint.textContent = '';

  if (q.required && (!val || !val.trim())) {
    if (hint) hint.textContent = '→ This plate is required for the door register.';
    const input = sectionElements[idx + 1].querySelector('input');
    if (input) {
      input.classList.remove('shake');
      void input.offsetWidth;
      input.classList.add('shake');
      input.focus();
    }
    return false;
  }
  if (q.type === 'email' && val && !/^\S+@\S+\.\S+$/.test(val)) {
    if (hint) hint.textContent = '→ Enter a valid email format for door pass delivery.';
    const input = sectionElements[idx + 1].querySelector('input');
    if (input) {
      input.classList.remove('shake');
      void input.offsetWidth;
      input.classList.add('shake');
      input.focus();
    }
    return false;
  }
  return true;
}

function refreshBadgeDisplay() {
  $('#badge-name').textContent = state.name || '—';
  $('#badge-email').textContent = state.email || '—';
  $('#badge-desk').textContent = state.desk || '—';
  $('#badge-archetype').textContent = state.archetype ? state.archetype.split('—')[0].trim() : '—';
  $('#badge-can').textContent = state.can || '—';
  $('#badge-posture').textContent = state.posture ? state.posture.slice(0, 24) + '…' : '—';
}

narrative.addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;

  if (btn.dataset.target !== undefined) {
    const idx = +btn.dataset.target;
    if (idx > 0 && !validatePlate(idx - 1)) return;
    refreshBadgeDisplay();
    navigateTo(idx);
    return;
  }

  if (btn.classList.contains('chip')) {
    const container = btn.parentNode;
    const key = container.dataset.key;
    container.querySelectorAll('.chip').forEach(c => c.classList.remove('sel'));
    btn.classList.add('sel');
    state[key] = btn.dataset.val;
    refreshBadgeDisplay();
    const plateId = +btn.closest('section').id.slice(1);
    setTimeout(() => navigateTo(plateId), 360);
  }
});

narrative.addEventListener('input', e => {
  const key = e.target.dataset.key;
  if (!key) return;
  state[key] = e.target.value;
  if (e.target.type === 'range') {
    const val = +e.target.value;
    $('#sat-label').textContent = SATURATION_LABELS[val - 1] || '';
  }
  refreshBadgeDisplay();
});

narrative.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('input[type=text], input[type=email]')) {
    e.preventDefault();
    const plateId = +e.target.closest('section').id.slice(1);
    if (validatePlate(plateId - 1)) {
      refreshBadgeDisplay();
      navigateTo(plateId);
    }
  }
});

// Arrow Navigation (Up / Down / J / K)
window.addEventListener('keydown', e => {
  if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
  const currentPlate = Math.round(currentScroll);
  if (e.key === 'ArrowDown' || e.key === 'j') {
    e.preventDefault();
    navigateTo(currentPlate);
  } else if (e.key === 'ArrowUp' || e.key === 'k') {
    e.preventDefault();
    navigateTo(Math.max(-1, currentPlate - 2));
  }
});

$('#submit-btn').onclick = async () => {
  for (let i = 0; i < QUESTIONS.length; i++) {
    if (QUESTIONS[i].required && !validatePlate(i)) {
      sectionElements[i + 1].scrollIntoView({ behavior: 'smooth' });
      return;
    }
  }
  const payloadBox = $('#payload-view');
  const finalHint = $('#final-hint');
  payloadBox.hidden = false;
  payloadBox.textContent = JSON.stringify({
    event: "OFF GRID / ऑफ़ ग्रिड",
    window: "16:00 — 19:00 IST",
    ground: document.documentElement.dataset.theme || "paper",
    pass: state
  }, null, 2);

  try {
    if (BRAND_DATA.endpoint) {
      await fetch(BRAND_DATA.endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(state)
      });
    }
    finalHint.textContent = '✓ Badge pass registered on paper cardstock. Copy registration payload below.';
    $('#submit-btn').textContent = 'Pass Issued ✓';
  } catch (_) {
    finalHint.textContent = '→ Disconnected from network. Offline registration payload generated below.';
  }
};

// Section Reveal Observer
const revealObserver = new IntersectionObserver(entries => {
  entries.forEach(entry => entry.target.classList.toggle('on', entry.isIntersecting));
}, { threshold: 0.45 });
sectionElements.forEach(s => revealObserver.observe(s));

// Ground Theme Management
const themeBtn = $('#theme-btn');
const themeModes = ['paper', 'golden-hour', 'ink'];
let activeThemeIdx = 0;

function applyTheme(name) {
  if (name === 'paper') {
    delete document.documentElement.dataset.theme;
    themeBtn.textContent = 'Ground: Paper';
  } else if (name === 'golden-hour') {
    document.documentElement.dataset.theme = 'golden-hour';
    themeBtn.textContent = 'Ground: Cobalt (17:15)';
  } else {
    document.documentElement.dataset.theme = 'ink';
    themeBtn.textContent = 'Ground: Ink';
  }
}

themeBtn.onclick = () => {
  activeThemeIdx = (activeThemeIdx + 1) % themeModes.length;
  applyTheme(themeModes[activeThemeIdx]);
};

// ==========================================================================
// ADVANCED MATHEMATICAL 3D / SDF ASCII RAYMARCHING ENGINE
// One lead shape (The Interval Mark) that continuously deforms & mutates
// ==========================================================================
const asciiCanvas = $('#ascii-canvas');
const telemetryPlate = $('#telemetry-plate');
const telemetryBar = $('#telemetry-bar');

const COLS = 68;
const ROWS = 30;
let currentScroll = 0, targetScroll = 0;
let mouseX = 0, mouseY = 0;

// Mouse reaction
window.addEventListener('mousemove', e => {
  mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
  mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
});

function updateScrollTarget() {
  targetScroll = Math.max(0, Math.min(totalPlates - 1, window.scrollY / window.innerHeight));
}
window.addEventListener('scroll', updateScrollTarget, { passive: true });
window.addEventListener('resize', () => {
  updateScrollTarget();
  fitAscii();
});

function fitAscii() {
  const isMobile = window.innerWidth <= 960;
  const stageWidth = isMobile ? window.innerWidth : window.innerWidth * 0.52;
  const stageHeight = isMobile ? window.innerHeight * 0.4 : window.innerHeight * 0.55;
  const fs = Math.max(7.5, Math.min(stageWidth / (COLS * 0.62), stageHeight / (ROWS * 1.15)));
  asciiCanvas.style.fontSize = fs + 'px';
}
fitAscii();
updateScrollTarget();

// Signed Distance Field (SDF) Primitives
const sdBox = (p, b) => {
  const qx = Math.abs(p.x) - b.x;
  const qy = Math.abs(p.y) - b.y;
  const qz = Math.abs(p.z) - b.z;
  const ox = Math.max(qx, 0), oy = Math.max(qy, 0), oz = Math.max(qz, 0);
  return Math.hypot(ox, oy, oz) + Math.min(Math.max(qx, Math.max(qy, qz)), 0);
};

const sdCylinder = (p, h, r) => {
  const d = Math.hypot(p.x, p.z) - r;
  const y = Math.abs(p.y) - h;
  return Math.min(Math.max(d, y), 0) + Math.hypot(Math.max(d, 0), Math.max(y, 0));
};

const sdTorus = (p, R, r) => {
  const q = Math.hypot(p.x, p.z) - R;
  return Math.hypot(q, p.y) - r;
};

// 12 Continuous Morphing Shapes:
// 00: Lead Form - The Interval Mark (Grid cell with cut corner notch)
// 01: Identification Badge Card
// 02: Transceiver Radio Loop / Signal Antenna
// 03: Corporate Tower Block
// 04: 6-Sided Analog Archetype Hexagonal Seal
// 05: Chilled Cold Can with beveled rim
// 06: Pause Bars (||)
// 07: Shielded Device Enclosure
// 08: Time-Block Sector Dial (16:00 - 19:00)
// 09: Saturation Barometer Gauge
// 10: Severed Terminal / Broken Circuit
// 11: Final OG Architectural Monogram Block

const SHAPE_NAMES = [
  "00 // INTERVAL MARK",
  "01 // BADGE PASS",
  "02 // SIGNAL WAVE",
  "03 // TOWER MONOLITH",
  "04 // ARCHETYPE SEAL",
  "05 // COLD CAN",
  "06 // PAUSE BARS (||)",
  "07 // SHIELDED ENCLOSURE",
  "08 // TIME-BLOCK DIAL",
  "09 // SATURATION GAUGE",
  "10 // SEVERED TERMINAL",
  "11 // CONCLUSION (OG)"
];

const SDF_SHAPES = [
  // 00: The Interval Mark (Thick block with corner notch cut out)
  p => {
    const box = sdBox(p, { x: 0.85, y: 0.85, z: 0.25 }) - 0.04;
    // Notch cut out in upper right corner
    const notch = sdBox({ x: p.x - 0.55, y: p.y - 0.55, z: p.z }, { x: 0.45, y: 0.45, z: 0.35 });
    return Math.max(box, -notch);
  },

  // 01: Identification Card Badge (Portrait card with punch slot)
  p => {
    const card = sdBox(p, { x: 0.65, y: 0.95, z: 0.12 }) - 0.04;
    const hole = sdBox({ x: p.x, y: p.y - 0.78, z: p.z }, { x: 0.22, y: 0.05, z: 0.2 });
    return Math.max(card, -hole);
  },

  // 02: Signal Wave / Helical Transceiver
  p => {
    const ring = sdTorus(p, 0.75, 0.14);
    const wave = Math.sin(p.x * 6 + p.y * 3) * 0.06;
    return ring + wave;
  },

  // 03: Corporate Tower Grid Monolith
  p => {
    const tower = sdBox(p, { x: 0.45, y: 1.05, z: 0.45 }) - 0.02;
    const gridRibs = Math.abs(Math.sin(p.y * 14)) * 0.05;
    return tower + gridRibs;
  },

  // 04: Analog Archetype Hexagonal Seal
  p => {
    const qx = Math.abs(p.x), qy = Math.abs(p.y), qz = Math.abs(p.z);
    const hex = Math.max(qx * 0.866 + qy * 0.5, qy) - 0.85;
    const slab = Math.max(hex, qz - 0.2);
    return slab - 0.04;
  },

  // 05: Chilled Cold Can (Cylinder with beveled rim)
  p => {
    const can = sdCylinder(p, 0.85, 0.46) - 0.03;
    const rim = Math.abs(p.y) > 0.82 ? 0.04 : 0;
    return can + rim;
  },

  // 06: Pause Bars (|| Roman Numeral II)
  p => {
    const barL = sdBox({ x: p.x + 0.38, y: p.y, z: p.z }, { x: 0.14, y: 0.95, z: 0.25 }) - 0.03;
    const barR = sdBox({ x: p.x - 0.38, y: p.y, z: p.z }, { x: 0.14, y: 0.95, z: 0.25 }) - 0.03;
    return Math.min(barL, barR);
  },

  // 07: Shielded Device Enclosure
  p => {
    const body = sdBox(p, { x: 0.52, y: 0.98, z: 0.14 }) - 0.06;
    const screenCut = sdBox({ x: p.x, y: p.y, z: p.z - 0.1 }, { x: 0.42, y: 0.82, z: 0.06 });
    return Math.max(body, -screenCut);
  },

  // 08: Time-Block Dial (Chronometer arc)
  p => {
    const d = Math.hypot(p.x, p.y);
    const ring = Math.max(Math.abs(d - 0.78) - 0.14, Math.abs(p.z) - 0.16);
    const angle = Math.atan2(p.y, p.x);
    const cut = (angle > -0.8 && angle < 1.6) ? -0.2 : 0.4;
    return Math.max(ring, cut) - 0.03;
  },

  // 09: Saturation Gauge Dial
  p => {
    const arc = Math.max(Math.abs(Math.hypot(p.x, p.y + 0.3) - 0.82) - 0.12, Math.abs(p.z) - 0.15);
    const needle = sdBox({ x: p.x + p.y * 0.4, y: p.y + 0.1, z: p.z }, { x: 0.06, y: 0.65, z: 0.2 });
    return Math.min(arc, needle);
  },

  // 10: Severed Terminal / Broken Circuit
  p => {
    const ring = sdTorus(p, 0.8, 0.18);
    const sever = sdBox({ x: p.x - 0.5, y: p.y, z: p.z }, { x: 0.3, y: 0.4, z: 0.5 });
    return Math.max(ring, -sever);
  },

  // 11: Conclusion Monogram Stamp Block
  p => {
    const outer = sdBox(p, { x: 0.88, y: 0.88, z: 0.22 }) - 0.05;
    const inner = sdBox(p, { x: 0.55, y: 0.55, z: 0.3 });
    return Math.max(outer, -inner);
  }
];

// ASCII Shading Ramp (Strictly authentic high-definition riso character ramp)
const ASCII_RAMP = "  ·:-=+*#%@█";
const prefersReduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

let time = 0;

function raymarchFrame(timestamp) {
  time = timestamp / 1000;
  currentScroll += (targetScroll - currentScroll) * (prefersReduced ? 1 : 0.08);

  const baseIdx = Math.min(totalPlates - 2, Math.floor(currentScroll));
  const frac = currentScroll - baseIdx;
  // Smooth hermite interpolation for fluid liquid-metallic morphing
  const morphFrac = frac * frac * (3 - 2 * frac);

  const shapeA = SDF_SHAPES[baseIdx] || SDF_SHAPES[0];
  const shapeB = SDF_SHAPES[baseIdx + 1] || SDF_SHAPES[0];

  // 3D Rotation angles: gentle continuous spin + mouse reaction + scroll rotation
  const rotY = (prefersReduced ? 0 : time * 0.4) + currentScroll * 0.65 + mouseX * 0.5;
  const rotX = 0.28 + (prefersReduced ? 0 : Math.sin(time * 0.5) * 0.15) + mouseY * 0.4;

  const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
  const cosX = Math.cos(rotX), sinX = Math.sin(rotX);

  // Light vector (upper left key light)
  const lx = 0.577, ly = 0.577, lz = -0.577;

  let buffer = '';

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      // Screen space coords (-1 to 1) with aspect ratio correction
      const u = (c - COLS / 2 + 0.5) / (COLS / 2.3);
      const v = (r - ROWS / 2 + 0.5) / (ROWS / 1.6);

      // Ray origin & direction
      let roX = 0, roY = 0, roZ = -2.6;
      let rdX = u, rdY = v, rdZ = 1.8;
      const invLen = 1 / Math.hypot(rdX, rdY, rdZ);
      rdX *= invLen; rdY *= invLen; rdZ *= invLen;

      // Raymarching loop (16 steps)
      let t = 0;
      let hit = false;
      let d = 0;

      for (let s = 0; s < 16; s++) {
        const px = roX + rdX * t;
        const py = roY + rdY * t;
        const pz = roZ + rdZ * t;

        // Apply inverse 3D rotation to point
        // Rotate around Y
        const yx = px * cosY + pz * sinY;
        const yz = -px * sinY + pz * cosY;
        // Rotate around X
        const xy = py * cosX - yz * sinX;
        const xz = py * sinX + yz * cosX;

        const rotatedPoint = { x: yx, y: xy, z: xz };

        // Morph between shape A and shape B
        const distA = shapeA(rotatedPoint);
        const distB = shapeB(rotatedPoint);
        d = distA * (1 - morphFrac) + distB * morphFrac;

        if (d < 0.015) {
          hit = true;
          break;
        }
        t += Math.max(d, 0.05);
        if (t > 4.5) break;
      }

      if (hit) {
        // Calculate surface normal via gradient approximation
        const eps = 0.02;
        const sampleDist = pt => {
          const yx = pt.x * cosY + pt.z * sinY;
          const yz = -pt.x * sinY + pt.z * cosY;
          const xy = pt.y * cosX - yz * sinX;
          const xz = pt.y * sinX + yz * cosX;
          const p = { x: yx, y: xy, z: xz };
          return shapeA(p) * (1 - morphFrac) + shapeB(p) * morphFrac;
        };

        const pt = { x: roX + rdX * t, y: roY + rdY * t, z: roZ + rdZ * t };
        const nx = sampleDist({ x: pt.x + eps, y: pt.y, z: pt.z }) - sampleDist({ x: pt.x - eps, y: pt.y, z: pt.z });
        const ny = sampleDist({ x: pt.x, y: pt.y + eps, z: pt.z }) - sampleDist({ x: pt.x, y: pt.y - eps, z: pt.z });
        const nz = sampleDist({ x: pt.x, y: pt.y, z: pt.z + eps }) - sampleDist({ x: pt.x, y: pt.y, z: pt.z - eps });
        const nLen = 1 / (Math.hypot(nx, ny, nz) || 1);

        // Diffuse Lambertian reflection + specular bounce
        const diff = Math.max(0, (nx * nLen * lx + ny * nLen * ly + nz * nLen * lz));
        const spec = Math.pow(Math.max(0, -(rdX * lx + rdY * ly + rdZ * lz)), 8) * 0.35;
        const light = diff * 0.8 + spec + 0.15;

        const charIdx = Math.max(1, Math.min(ASCII_RAMP.length - 1, Math.floor(light * (ASCII_RAMP.length - 1))));
        buffer += ASCII_RAMP[charIdx];
      } else {
        // Subtle ambient riso coordinate grid in background
        const isTick = (c % 16 === 0 && r % 8 === 0);
        buffer += isTick ? '+' : ' ';
      }
    }
    buffer += '\n';
  }

  asciiCanvas.textContent = buffer;

  // Telemetry updates
  const activeIndex = Math.min(totalPlates - 1, Math.round(currentScroll));
  telemetryPlate.textContent = SHAPE_NAMES[activeIndex] || SHAPE_NAMES[0];

  const pct = Math.round((currentScroll / (totalPlates - 1)) * 100);
  const filledBars = Math.floor(pct / 10);
  telemetryBar.textContent = `[${'█'.repeat(filledBars)}${'░'.repeat(10 - filledBars)}] ${pct}%`;

  requestAnimationFrame(raymarchFrame);
}
requestAnimationFrame(raymarchFrame);
</script>
